<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Travel Recommendation</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== NAVIGATION BAR ===== -->
  <nav class="navbar">
    <div class="logo">🌍 TravelRec</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html" class="active">Contact Us</a></li>
    </ul>
  </nav>

  <!-- ===== CONTACT FORM ===== -->
  <section class="contact-section">
    <h1>Contact Us</h1>
    <p>Have a question or suggestion? Send us an email and we'll get back to you!</p>

    <form id="contactForm" onsubmit="submitForm(event)">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required />

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Type your message..." required></textarea>

      <button type="submit">Send Email</button>
    </form>

    <p id="formStatus" class="form-status"></p>
  </section>

  <footer>
    <p>&copy; 2025 Travel Recommendation. All rights reserved.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
